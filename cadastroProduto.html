<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="cadastroProduto.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Sweet Donut - Cadastro de Produtos</title>
  </head>

  <body>
    <header class="p-3">
      <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html">
          <img src="./imagens/logo.png" alt="Logo Sweet Donut" class="logo" />
        </a>
        <nav>
          <ul class="nav">
            <li class="nav-item">
              <a class="nav-link text-dark" href="quemSomos.html">Quem Somos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="produtos.html">Produtos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="contato.html">Contato</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="unidades.html">Unidades</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="cadastroProduto.html">Cadastrar Produto</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark cart-icon" href="finalizarCompra.html">
                🛒 Carrinho
                <span class="cart-badge" id="cart-total">0</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-5">
      <h1 class="text-center mb-4">Cadastro de Produtos</h1>
      
      <form id="productForm" class="product-form">
        <div class="mb-3">
          <label for="productName" class="form-label">Nome do Produto</label>
          <input type="text" class="form-control" id="productName" required>
        </div>

        <div class="mb-3">
          <label for="productDescription" class="form-label">Descrição</label>
          <textarea class="form-control" id="productDescription" rows="3" required></textarea>
        </div>

        <div class="mb-3">
          <label for="productPrice" class="form-label">Preço (R$)</label>
          <input type="number" class="form-control" id="productPrice" step="0.01" required>
        </div>

        <div class="mb-3">
          <label for="productImage" class="form-label">Imagem do Produto</label>
          <input type="file" class="form-control" id="productImage" accept="image/*" required>
        </div>

        <div class="mb-3">
          <label for="productCategory" class="form-label">Categoria</label>
          <select class="form-select" id="productCategory" required>
            <option value="">Selecione uma categoria</option>
            <option value="donuts">Donuts</option>
            <option value="bebidas">Bebidas</option>
            <option value="combos">Combos</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="productStock" class="form-label">Estoque</label>
          <input type="number" class="form-control" id="productStock" required>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
        </div>
      </form>
    </main>

    <footer style="background-color: #333333;" class="py-4">
      <div class="container text-center">
        <p style="color: black;">&copy; 2024 Sweet Donut. Todos os direitos reservados.</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
